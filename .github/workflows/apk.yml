name: Build Android app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy the app into www
        run: |
          mkdir -p www
          cp index.html www/
          cp icon-192.png icon-512.png www/ || true
          cp manifest.webmanifest www/ || true
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/
          mkdir -p www/fonts
          for f in plus-jakarta-sans:500 plus-jakarta-sans:600 plus-jakarta-sans:700 plus-jakarta-sans:800 jetbrains-mono:600 jetbrains-mono:800; do
            n=${f%%:*}; w=${f##*:}
            cp node_modules/@fontsource/$n/files/$n-latin-$w-normal.woff2 www/fonts/$n-$w.woff2 || echo "missing $n $w"
          done
          echo "::warning title=Fonts::$(ls www/fonts | tr '\n' ' ')"
          mkdir -p www/tess/lang
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js www/tess/
          cp node_modules/tesseract.js-core/tesseract-core*.wasm.js www/tess/
          cp node_modules/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz www/tess/lang/ || cp $(find node_modules/@tesseract.js-data/eng -name 'eng.traineddata.gz' | head -1) www/tess/lang/
          echo "::warning title=Receipt reading files::$(ls -la www/tess www/tess/lang | awk '{print $5, $9}' | tr '\n' ' ')"
          cp node_modules/@capacitor/core/dist/capacitor.js www/ || echo 'no capacitor.js - app uses the native bridge directly'

      - name: Create the Android project
        run: npx cap add android

      - name: Storage permission and app icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' $M
          # GPS trip logging: location, a foreground service while a trip is open, and its notification
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' $M
          sed -i 's#</application>#    <service android:name=".TrackingService" android:exported="false" android:foregroundServiceType="location" />\n    </application>#' $M
          # car Bluetooth, month-end reminders, restart handling and the home-screen widget
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.REQUEST_COMPANION_START_FOREGROUND_SERVICES_FROM_BACKGROUND" />\n    <uses-permission android:name="android.permission.REQUEST_COMPANION_RUN_IN_BACKGROUND" />\n    <uses-feature android:name="android.software.companion_device_setup" android:required="false" />\n</manifest>#' $M
          sed -i 's#</application>#    <receiver android:name=".ReminderReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /><action android:name="android.intent.action.MY_PACKAGE_REPLACED" /><action android:name="android.bluetooth.device.action.ACL_CONNECTED" /><action android:name="android.bluetooth.device.action.ACL_DISCONNECTED" /><action android:name="android.app.action.ENTER_CAR_MODE" /><action android:name="android.app.action.EXIT_CAR_MODE" /></intent-filter></receiver>\n    <receiver android:name=".WidgetProvider" android:exported="true" android:label="DrivR"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/mbp_widget_info" /></receiver>\n    </application>#' $M
          cp -r native/res/* android/app/src/main/res/
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p $RES/mipmap-$n
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_foreground.png
          done
          cat $M

      - name: Add the trip logging code
        run: |
          D=$(dirname "$(find android/app/src/main/java -name MainActivity.java | head -1)")
          cp native/*.java "$D"/
          ls "$D"

      - name: Sync
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
            -Pandroid.injected.signing.store.password=levelsurvey2026 \
            -Pandroid.injected.signing.key.alias=levelsurvey \
            -Pandroid.injected.signing.key.password=levelsurvey2026 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            # put the compile errors where they can be read without the full log
            msg=$(grep -E "error:|: error|What went wrong|^e: |FAILED|Exception" -A3 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::$msg"
            exit $code
          fi
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/DrivR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DrivR-apk
          path: DrivR.apk

      - name: Publish as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DrivR (build ${{ github.run_number }})
          files: DrivR.apk
          make_latest: true
